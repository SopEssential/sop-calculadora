<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sop. Calculadora</title>
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sop.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f2f0eb;--ink:#111110;--accent:#cc0000;--card:#ffffff;--muted:#77736b;
  --line:#ddd9d0;--soft:#e7e4dc;--ok:#1d7a3a;
  --display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
input,select,textarea{font-family:var(--sans);font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:18px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top))}
.logo{height:36px;width:auto;display:block}
.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.tabs button{font-family:var(--display);font-size:21px;letter-spacing:.05em;background:none;border:0;padding:6px 12px 4px;border-radius:8px;cursor:pointer;color:var(--muted);line-height:1.1}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);background:var(--soft);box-shadow:inset 0 -3px 0 var(--accent)}
.drive{font-family:var(--display);font-size:17px;letter-spacing:.06em;border:2px solid var(--ink);background:transparent;border-radius:8px;padding:6px 12px 4px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-left:auto}
.drive i{width:9px;height:9px;border-radius:50%;background:#b8b4ab;display:inline-block}
.drive.ok i{background:var(--ok)}
.drive.busy i{background:#d49a00;animation:pulse 1s infinite}
.drive.err i,.drive.exp i{background:var(--accent)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 20px 48px}
.view{display:none}
.view.on{display:block}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vt{font-family:var(--display);font-size:44px;margin:0;letter-spacing:.02em;line-height:.95;font-weight:400}
.vt small{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-left:8px;vertical-align:middle}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.card+.card{margin-top:14px}
.sec{font-family:var(--display);font-size:19px;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:400;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:44px;color:var(--line);letter-spacing:.04em;font-weight:400}

/* ---------- buttons ---------- */
.btn{font-family:var(--display);font-size:19px;letter-spacing:.06em;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:10px 16px 8px;cursor:pointer;line-height:1;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.bsm{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.04em;padding:7px 10px;border:1.5px solid var(--ink);background:#fff;border-radius:7px;cursor:pointer;white-space:nowrap;text-transform:uppercase}
.bsm:hover{background:var(--soft)}
.bsm.on{background:var(--ink);color:#fff}
.bsm.danger{border-color:var(--accent);color:var(--accent)}
.bsm.danger:hover{background:var(--accent);color:#fff}
.bsm.icon{width:34px;padding:7px 0;text-align:center}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.03em;white-space:nowrap}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:36px;font-size:18px;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--soft)}
.stepper span,.stepper input{min-width:34px;width:48px;text-align:center;font-weight:800;border:0;padding:0;font-size:15px}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.margin-box{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.margin-box .fld{flex:1;min-width:140px}
.res{position:sticky;top:84px;background:var(--ink);color:#fff;border-radius:var(--r);padding:20px;border:0}
.res .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9a59c}
.res .big{font-family:var(--display);font-size:64px;line-height:.95;letter-spacing:.01em}
.res .profit{font-family:var(--display);font-size:30px;color:#ff4d4d;line-height:1}
.res .kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0;padding:14px 0;border-top:1px solid #333;border-bottom:1px solid #333}
.res .kv b{display:block;font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.02em}
.res .bd{font-size:12px;color:#cfcbc2}
.res .bd div{display:flex;justify-content:space-between;padding:3px 0}
.res .btn{background:#fff;color:var(--ink);border-color:#fff;margin-top:10px}
.res .btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.neg{color:var(--accent)!important}

/* ---------- lists / cards ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.it-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.it-t{font-weight:800;font-size:15px;word-break:break-word}
.it-s{font-size:12px;color:var(--muted)}
.it-p{font-family:var(--display);font-size:26px;letter-spacing:.02em;white-space:nowrap;line-height:1}
.it-p.red{color:var(--accent)}
.it-lines{font-size:12px;border-top:1px solid var(--soft);padding-top:6px}
.it-lines div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.it-lines span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;background:var(--bg);border-radius:8px;padding:8px}
.meta3 b{display:block;font-size:13px}
.search{max-width:280px}

/* order lines */
.ol{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.ol+.ol{margin-top:8px}
.ol-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ol-r input.nm{flex:1;min-width:150px;font-weight:700}
.ol-pr{font-family:var(--display);font-size:22px;min-width:80px;text-align:right}
.ol-d{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.ol-edit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tot{margin-top:12px;border-top:2px solid var(--ink);padding-top:10px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.tot .g{font-family:var(--display);font-size:30px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px}
.stat:nth-child(2){background:#fff;color:var(--ink);border:1px solid var(--line)}
.stat:nth-child(3){background:var(--accent)}
.stat span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:400;letter-spacing:.02em;line-height:1.1}
.cols2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(17,17,16,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:28px 14px}
.modal.on{display:flex}
.mbox{background:var(--bg);width:100%;max-width:720px;border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto 0}
.mbox.wide{max-width:960px}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--ink)}
.mhead h3{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.04em;font-weight:400;flex:1;line-height:1}
.mhead .x{border:0;background:none;font-size:28px;cursor:pointer;line-height:1;padding:0 4px}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
.pick:hover,.pick.on{border-color:var(--ink)}
.pick+.pick{margin-top:6px}
.pick .a{font-size:22px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:5px 6px 5px 12px;font-weight:800;font-size:13px}
.lines-h,.ln{display:grid;grid-template-columns:minmax(0,1fr) 74px 104px 96px 34px;gap:6px;align-items:center}
.lines-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 2px 4px}
.ln+.ln{margin-top:6px}
.ln .imp{text-align:right;font-weight:700;font-size:13px}
.r{text-align:right}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.paper-wrap{background:#cfcbc2;border-radius:10px;padding:12px;overflow:hidden}
.paper{width:794px;background:#fff;padding:48px 52px;transform-origin:top left;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.prev{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.prev div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.prev b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);font-weight:400;letter-spacing:.02em;text-transform:none}
.prev div.hl{background:var(--ink)}
.prev div.hl b{color:#fff}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;background:none;border:0;color:#9b978e;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;font-family:var(--display);font-size:14px;letter-spacing:.06em}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:#fff}
.bnav button.on svg{color:#ff3b3b}

@media (max-width:900px){
  .calc{grid-template-columns:1fr}
  .res{position:static}
  .cols2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .tabs{display:none}
  .bnav{display:flex}
  .top{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
  .logo{height:30px}
  main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .vt{font-size:36px}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stat{padding:10px}
  .stat b{font-size:20px}
  .stat span{font-size:9px}
  .modal{padding:0}
  .mbox,.mbox.wide{border-radius:0;min-height:100%;max-width:none}
  .mfoot{position:sticky;bottom:0;background:var(--bg);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .lines-h{display:none}
  .ln{grid-template-columns:1fr 1fr 1fr 34px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
  .ln .d{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .search{max-width:none;width:100%}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<header class="top">
  <img class="logo" id="logoTop" alt="Sop.">
  <nav class="tabs" id="tabsTop">
    <button data-act="tab" data-id="calc" class="on">Calculadora</button>
    <button data-act="tab" data-id="orders">Comandes</button>
    <button data-act="tab" data-id="invoices">Factures</button>
    <button data-act="tab" data-id="catalog">Catàleg</button>
    <button data-act="tab" data-id="clients">Clients</button>
  </nav>
  <button class="drive" id="driveBtn" data-act="drive" title="Google Drive"><i></i><span>DRIVE</span></button>
</header>

<main>
  <!-- ============ CALCULADORA ============ -->
  <section class="view on" id="v-calc">
    <div class="vhead"><h1 class="vt">Calculadora</h1></div>
    <div class="calc">
      <div>
        <div class="card">
          <h3 class="sec">Peça</h3>
          <div class="row" style="align-items:flex-end">
            <label class="fld" style="flex:1;min-width:180px"><span>Nom de la peça</span><input id="calcName" type="text" placeholder="Ex: Suport mòbil"></label>
            <div class="fld"><span>Quantitat</span>
              <div class="stepper"><button data-act="calc-qty" data-id="-1">−</button><input id="calcQty" type="number" min="1" step="1" value="1"><button data-act="calc-qty" data-id="1">+</button></div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 class="sec">Costos i marge</h3>
          <div id="calcForm"></div>
        </div>
      </div>
      <aside class="res card">
        <div class="lbl">Preu de venda / u</div>
        <div class="big" id="rPrice">0,00 €</div>
        <div class="lbl" style="margin-top:10px">Benefici net / u</div>
        <div class="profit" id="rProfit">0,00 €</div>
        <div class="kv">
          <div><span class="lbl">Material</span><b id="rMat">0,00 €</b></div>
          <div><span class="lbl">Màquina</span><b id="rMach">0,00 €</b></div>
          <div><span class="lbl">Cost total</span><b id="rCost">0,00 €</b></div>
        </div>
        <div class="bd" id="rBreak"></div>
        <button class="btn red block" data-act="calc-add" style="margin-top:16px">+ Afegir a la comanda</button>
        <button class="btn block" data-act="calc-cat">+ Guardar al catàleg</button>
      </aside>
    </div>
  </section>

  <!-- ============ COMANDES ============ -->
  <section class="view" id="v-orders">
    <div class="vhead"><h1 class="vt">Comandes</h1></div>
    <div class="cols2">
      <div class="card">
        <h3 class="sec"><span id="ordTitle">Comanda actual</span><span class="row"><button class="bsm danger" data-act="ord-clear">Buidar</button></span></h3>
        <div class="grid2">
          <label class="fld"><span>Nom de la comanda</span><input id="ordName" type="text" placeholder="Ex: Comanda Joan"></label>
          <label class="fld"><span>Client (opcional)</span><select id="ordClient"></select></label>
        </div>
        <div id="ordItems" style="margin-top:14px"></div>
        <div class="row" style="margin-top:10px">
          <select id="ordCatSel" style="flex:1;min-width:160px"></select>
          <button class="bsm" data-act="ord-add-cat">+ Del catàleg</button>
        </div>
        <div id="ordTotals"></div>
        <div class="row" style="margin-top:14px">
          <button class="btn red" data-act="ord-save" style="flex:1">Guardar comanda</button>
        </div>
      </div>
      <div>
        <h3 class="sec"><span>Historial</span><span class="it-s" id="histCount"></span></h3>
        <div id="histList"></div>
      </div>
    </div>
  </section>

  <!-- ============ FACTURES ============ -->
  <section class="view" id="v-invoices">
    <div class="vhead">
      <h1 class="vt">Factures</h1>
      <div class="row"><select id="invYear" style="width:auto"></select><button class="btn red" data-act="inv-new">+ Nova factura</button></div>
    </div>
    <div class="stats">
      <div class="stat"><span>Total facturat</span><b id="stTotal">0,00 €</b></div>
      <div class="stat"><span>IVA</span><b id="stIva">0,00 €</b></div>
      <div class="stat"><span>Net</span><b id="stNet">0,00 €</b></div>
    </div>
    <div id="invList"></div>
  </section>

  <!-- ============ CATÀLEG ============ -->
  <section class="view" id="v-catalog">
    <div class="vhead">
      <h1 class="vt">Catàleg</h1>
      <div class="row"><input id="catSearch" class="search" type="search" placeholder="Cercar…"><button class="btn red" data-act="cat-new">+ Nou producte</button></div>
    </div>
    <div id="catList"></div>
  </section>

  <!-- ============ CLIENTS ============ -->
  <section class="view" id="v-clients">
    <div class="vhead">
      <h1 class="vt">Clients</h1>
      <div class="row"><input id="cliSearch" class="search" type="search" placeholder="Cercar…"><button class="btn red" data-act="cli-new">+ Nou client</button></div>
    </div>
    <div id="cliList"></div>
  </section>
</main>

<nav class="bnav" id="tabsBottom">
  <button data-act="tab" data-id="calc" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6.5h8M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01" stroke-linecap="round" stroke-width="2.4"/></svg>Calc</button>

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC_MAP[c]);
const num = x => { const n = parseFloat(String(x == null ? '' : x).replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = n => (Number(n) || 0).toLocaleString('ca-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sameId = (a, b) => String(a) === String(b);
const clone = o => JSON.parse(JSON.stringify(o));
const pad4 = n => String(n).padStart(4, '0');
function todayISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function fmtDate(s) {
  if (!s) return '';
  s = String(s);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) { const p = s.slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  return s;
}
function isoFromAny(s) {
  if (!s) return '';
  s = String(s);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : '';
}
function hhmm(h) { const t = Math.max(0, Math.round((Number(h) || 0) * 60)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function parseT(s) {
  s = String(s == null ? '' : s).trim().toLowerCase().replace(',', '.');
  if (!s) return 0;
  if (s.indexOf(':') >= 0) { const p = s.split(':'); return (parseInt(p[0], 10) || 0) + (parseInt(p[1], 10) || 0) / 60; }
  const m = s.match(/^(\d+(?:\.\d+)?)\s*h\s*(\d+)?/);
  if (m) return num(m[1]) + (parseInt(m[2], 10) || 0) / 60;
  return num(s);
}
function hashId(prefix, s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return prefix + (h >>> 0).toString(36); }
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

const LISTS = ['orders', 'clients', 'invoices', 'catalog'];
const KEY = { orders: 'sop_orders', clients: 'sop_clients', invoices: 'sop_invoices', catalog: 'sop_catalog' };
function lsGet(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('Error en desar: memòria del navegador plena'); return false; }
}
const DB = {
  all(name) { const a = lsGet(KEY[name], []); return Array.isArray(a) ? a : []; },
  find(name, id) { return DB.all(name).find(x => sameId(x.id, id)) || null; },
  write(name, arr) { return lsSet(KEY[name], arr); },
  put(name, item) {
    if (item.id == null || item.id === '') item.id = uid();
    item.updatedAt = Date.now();
    if (!item.createdAt) item.createdAt = Date.now();
    const a = DB.all(name);
    const i = a.findIndex(x => sameId(x.id, item.id));
    if (i >= 0) a[i] = item; else a.unshift(item);
    DB.write(name, a);
    driveSchedule();
    return item;
  },
  del(name, id) {
    DB.write(name, DB.all(name).filter(x => !sameId(x.id, id)));
    const d = lsGet('sop_deleted', {}); d[name + ':' + String(id)] = Date.now(); lsSet('sop_deleted', d);
    driveSchedule();
  }
};
function albCounter() { return parseInt(localStorage.getItem('sop_alb_num') || '0', 10) || 0; }
function setAlbCounter(n) { localStorage.setItem('sop_alb_num', String(n)); }

/* dades antigues: clients i catàleg sense id -> id estable derivat del contingut */
function migrate(name, arr) {
  const seen = new Set();
  return (Array.isArray(arr) ? arr : []).filter(x => x && typeof x === 'object').map(x => {
    if (x.id == null || x.id === '') {
      const basis = name === 'clients' ? [x.name, x.nif, x.email].join('|')
        : name === 'catalog' ? [x.name, x.ref].join('|') : JSON.stringify(x);
      let id = hashId(name.slice(0, 3) + '_', basis);
      while (seen.has(id)) id += 'x';
      x.id = id;
    }
    seen.add(String(x.id));
    return x;
  });
}
function migrateLocal() {
  LISTS.forEach(n => {
    const raw = lsGet(KEY[n], []);
    const m = migrate(n, clone(raw));
    if (JSON.stringify(m) !== JSON.stringify(raw)) DB.write(n, m);
  });
}

  { k: 'fin', l: 'Preu final', f: 'marginFin', lab: 'Preu final €', step: 0.5 }
];
const ALIASES = {
  filament: ['filament', 'filament_price'], elec: ['elec', 'electricity'], maint: ['maint', 'maintenance'],
  printTime: ['printTime', 'print_time'], postTime: ['postTime', 'post_time'],
  marginPct: ['marginPct', 'margin'], marginFin: ['marginFin', 'marginFinal']
};
function normV(v) {
  v = v || {};
  const pick = (k, def) => {
    const ks = ALIASES[k] || [k];
    for (let i = 0; i < ks.length; i++) { const x = v[ks[i]]; if (x !== undefined && x !== null && x !== '') return num(x); }
    return def;
  };
  const o = {};
  FIELDS.forEach(f => { o[f.k] = pick(f.k, f.def); });
  o.marginPct = pick('marginPct', 40);
  o.marginEur = pick('marginEur', 0);
  o.marginFin = pick('marginFin', 0);
  const m = v.mode || v.marginMode || 'pct';
  o.mode = (m === 'eur' || m === 'fin') ? m : 'pct';
  return o;
}
function compute(v) {
  v = normV(v);
  const fil = (v.weight / 1000) * v.filament * (1 + v.waste / 100);
  const elec = v.elec * v.printTime;
  const maint = v.maint * v.printTime;
  const mach = elec + maint;
  const cost = fil + mach + v.packaging;
  let price;
  if (v.mode === 'eur') price = cost + v.marginEur;
  else if (v.mode === 'fin') price = v.marginFin > 0 ? v.marginFin : cost;
  else price = cost * (1 + v.marginPct / 100);
  const profit = price - cost;
  return { fil, elec, maint, mach, cost, price, profit, pct: cost > 0 ? profit / cost * 100 : 0, time: v.printTime + v.postTime, v };
}

/* Formulari de costos reutilitzable (calculadora, catàleg, edició de peça) */
function costFormHTML(v) {
  v = normV(v);
  const fields = FIELDS.map(f => {
    const inp = f.time
      ? '<input type="text" inputmode="decimal" placeholder="h:mm" data-k="' + f.k + '" value="' + hhmm(v[f.k]) + '">'
      : '<input type="number" inputmode="decimal" min="0" step="' + f.step + '" data-k="' + f.k + '" value="' + v[f.k] + '">';
    return '<label class="fld"><span>' + f.l + '</span>' + inp + '</label>';
  }).join('');
  const seg = MODES.map(m => '<button type="button" data-mode="' + m.k + '" class="' + (v.mode === m.k ? 'on' : '') + '">' + m.l + '</button>').join('');
  const mf = MODES.map(m => '<label class="fld" data-mf="' + m.k + '"' + (v.mode === m.k ? '' : ' hidden') + '><span>' + m.lab + '</span><input type="number" inputmode="decimal" min="0" step="' + m.step + '" data-k="' + m.f + '" value="' + v[m.f] + '"></label>').join('');
  return '<div class="grid">' + fields + '</div><div class="margin-box"><div class="fld"><span>Mode de marge</span><div class="seg">' + seg + '</div></div>' + mf + '</div>';
}
function readCostForm(root) {
  const v = { mode: root.dataset.mode || 'pct' };
  $$('[data-k]', root).forEach(i => {
    const k = i.dataset.k;
    const f = FIELDS.find(x => x.k === k);
    v[k] = f && f.time ? parseT(i.value) : num(i.value);
  });
  return v;
}
function bindCostForm(root, v, onChange) {
  v = normV(v);
  root.dataset.mode = v.mode;

  root.oninput = () => onChange(readCostForm(root));
  root.onclick = e => {

    root.dataset.mode = b.dataset.mode;
    $$('[data-mode]', root).forEach(x => x.classList.toggle('on', x === b));
    $$('[data-mf]', root).forEach(x => { x.hidden = x.dataset.mf !== b.dataset.mode; });
    onChange(readCostForm(root));
  };
}

/* Impressió SEMPRE en una finestra nova (window.open). Mai regles media-print a la pàgina principal. */
function printDocument(title, innerHTML) {
  const html = '<!DOCTYPE html><html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(title) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">' +
    '<style>@page{size:A4;margin:14mm}html,body{margin:0;padding:0}body{background:#e6e3dc;font-family:Montserrat,Arial,sans-serif}' +
    '.bar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:10px;background:#111110}' +
    '.bar button{font:800 13px Montserrat,Arial,sans-serif;padding:10px 18px;border-radius:8px;border:2px solid #fff;background:#fff;color:#111;cursor:pointer}' +
    '.bar button.p{background:#cc0000;border-color:#cc0000;color:#fff}' +
    '.sheet{background:#fff;max-width:794px;margin:24px auto;padding:48px 52px;box-shadow:0 2px 14px rgba(0,0,0,.15)}' +
    'body.printing{background:#fff}body.printing .bar{display:none}body.printing .sheet{max-width:none;margin:0;padding:0;box-shadow:none}' +
    DOC_CSS + '</style></head><body>' +
    '<div class="bar"><button class="p" onclick="doPrint()">IMPRIMIR / PDF</button><button onclick="window.close()">TANCAR</button></div>' +
    '<div class="sheet">' + innerHTML + '</div>' +
    '<script>' +
    'function doPrint(){document.body.classList.add("printing");setTimeout(function(){window.print();},50);}' +
    'window.addEventListener("beforeprint",function(){document.body.classList.add("printing");});' +
    'window.addEventListener("afterprint",function(){document.body.classList.remove("printing");});' +
    'window.addEventListener("load",function(){var go=function(){setTimeout(doPrint,250);};if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);}else{go();}});' +
    '<\/script></body></html>';
  const w = window.open('', '_blank');
  if (w) {
    w.document.open();
    w.document.write(html);
    w.document.close();
    try { w.focus(); } catch (e) {}
    return true;
  }
  // Pla B si el navegador bloqueja finestres emergents: iframe ocult (la pàgina principal no es toca)
  try {
    const old = document.getElementById('printFrame'); if (old) old.remove();
    const f = document.createElement('iframe');
    f.id = 'printFrame';
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(f);
    const d = f.contentWindow.document;
    d.open(); d.write(html.replace('window.addEventListener("load"', 'window.addEventListener("x-noauto"')); d.close();
    setTimeout(() => { try { f.contentWindow.document.body.classList.add('printing'); f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('Permet les finestres emergents per imprimir'); } }, 700);
    return true;
  } catch (e) {
    toast('Permet les finestres emergents per imprimir');
    return false;
  }
}

let inv = null; // esborrany del assistent (wizard)
function nextInvoiceNum() {
  const max = DB.all('invoices').reduce((m, i) => Math.max(m, parseInt(String(i.num).replace(/\D/g, ''), 10) || 0), 0);
  return pad4(max + 1);
}
function startInvoice(opts) {
  opts = opts || {};
  inv = { id: null, num: nextInvoiceNum(), date: todayISO(), client: opts.client || null, clientId: opts.client ? String(opts.client.id || '') : '', lines: opts.lines && opts.lines.length ? opts.lines : [{ desc: '', qty: 1, price: 0 }], orderId: opts.orderId || null, saved: false };
  invStep(inv.client ? 2 : 1);
}
function editInvoice(id) {
  const x = DB.find('invoices', id); if (!x) return;
  inv = clone(x);
  inv.date = isoFromAny(inv.date) || todayISO();
  if (!Array.isArray(inv.lines) || !inv.lines.length) inv.lines = [{ desc: '', qty: 1, price: 0 }];
  inv.saved = true;
  invStep(2);
}
function invStepsBar(n) { return '<div class="steps">' + [1, 2, 3].map(i => '<span class="' + (i <= n ? 'on' : '') + '"></span>').join('') + '</div>'; }
function invTitle(n) { return (inv.id ? 'Factura ' + inv.num : 'Nova factura') + ' · ' + n + '/3'; }
function invStep(n) {
  inv.step = n;
  if (n === 1) {
    const body = invStepsBar(1) +
      '<h3 class="sec">1. Selecciona el client</h3>' +
      '<input id="invCliSearch" type="search" placeholder="Cercar client…" style="margin-bottom:10px">' +
      '<div id="invCliList"></div>' +
      '<div class="box" style="margin-top:14px"><h3 class="sec" style="margin-bottom:8px">Client nou</h3>' + clientFieldsHTML('qc_', null) +
      '<button class="btn" data-act="invw-quick" style="margin-top:10px">Crear i seleccionar</button></div>';
    openModal('inv', invTitle(1), body, '<button class="btn ghost" data-act="modal-close">Cancel·lar</button>' + (inv.client ? '<button class="btn red" data-act="invw-step" data-id="2">Continuar →</button>' : ''));
    renderInvClientList();
  } else if (n === 2) {
    const body = invStepsBar(2) +
      '<div class="row" style="margin-bottom:12px"><span class="chip">' + esc(inv.client ? inv.client.name : '—') + '<button class="bsm" data-act="invw-step" data-id="1">Canviar</button></span></div>' +
      '<div class="grid2" style="margin-bottom:14px"><label class="fld"><span>Núm. factura</span><input id="invNum" type="text" value="' + esc(inv.num) + '"></label>' +
      '<label class="fld"><span>Data</span><input id="invDate" type="date" value="' + esc(inv.date) + '"></label></div>' +
      '<h3 class="sec">2. Línies</h3>' +
      '<div class="lines-h"><span>Descripció</span><span class="r">Quant.</span><span class="r">Preu €</span><span class="r">Import</span><span></span></div>' +
      '<div id="invLines"></div>' +
      '<div class="row" style="margin-top:10px"><button class="bsm" data-act="invw-line-add">+ Línia</button><select id="invCatSel" style="flex:1;min-width:160px">' + catalogOptions() + '</select><button class="bsm" data-act="invw-cat-add">+ Del catàleg</button></div>' +
      '<div id="invTot"></div>';
    openModal('inv', invTitle(2), body, '<button class="btn ghost" data-act="invw-step" data-id="1">← Client</button><button class="btn red" data-act="invw-step" data-id="3">Vista prèvia →</button>');
    renderInvLines();
  } else {
    readInvHead();
    if (!inv.lines.some(l => (l.desc || '').trim() || num(l.price))) { toast('Afegeix almenys una línia'); invStep(2); return; }
    const body = invStepsBar(3) + '<div class="paper-wrap"><div class="paper">' + invoiceDocHTML(inv) + '</div></div>';
    openModal('inv', invTitle(3), body,
      '<button class="btn ghost" data-act="invw-step" data-id="2">← Editar</button><span class="spacer"></span>' +
      '<button class="btn ghost" data-act="invw-alb">Albarà</button><button class="btn" data-act="invw-save">Guardar</button><button class="btn red" data-act="invw-print">Imprimir</button>', true);
    requestAnimationFrame(fitPaper);
    setTimeout(fitPaper, 300);
  }
}
function renderInvClientList() {
  const box = $('#invCliList'); if (!box) return;
  const q = (($('#invCliSearch') || {}).value || '').toLowerCase().trim();
  const cl = clientsSorted().filter(c => !q || [c.name, c.company, c.nif, c.email].join(' ').toLowerCase().indexOf(q) >= 0);
  box.innerHTML = cl.length ? cl.map(c => '<button class="pick' + (inv.client && sameId(inv.client.id, c.id) ? ' on' : '') + '" data-act="invw-pick" data-id="' + esc(c.id) + '"><div><div style="font-weight:800">' + esc(c.name) + '</div><div class="it-s">' + esc([c.company, c.nif ? 'NIF: ' + c.nif : '', c.email].filter(Boolean).join(' · ')) + '</div></div><span class="a">›</span></button>').join('')
    : '<div class="it-s" style="padding:6px 2px">' + (q ? 'Cap client coincideix.' : 'Encara no hi ha clients. Crea-n\u2019un a sota.') + '</div>';
}
function readInvHead() {
  const n = $('#invNum'), d = $('#invDate');
  if (n) inv.num = (n.value || '').trim() || nextInvoiceNum();
  if (d) inv.date = d.value || todayISO();
}
function renderInvLines() {
  $('#invLines').innerHTML = inv.lines.map((l, i) =>
    '<div class="ln">' +
      '<input class="d" type="text" placeholder="Descripció" data-li="' + i + '" data-lf="desc" value="' + esc(l.desc) + '">' +
      '<input class="r" type="number" inputmode="decimal" min="0" step="1" data-li="' + i + '" data-lf="qty" value="' + esc(l.qty) + '">' +
      '<input class="r" type="number" inputmode="decimal" min="0" step="0.01" data-li="' + i + '" data-lf="price" value="' + esc(l.price) + '">' +
      '<span class="imp" data-limp="' + i + '">' + eur(num(l.qty) * num(l.price)) + '</span>' +
      '<button class="bsm danger icon" data-act="invw-line-del" data-id="' + i + '"' + (inv.lines.length <= 1 ? ' disabled' : '') + '>×</button>' +
    '</div>').join('');
  renderInvTot();
}
function renderInvTot() {
  const t = invTotals(inv.lines);
  $('#invTot').innerHTML = '<div class="tot"><div><span>Base imposable</span><span>' + eur(t.base) + '</span></div><div><span>IVA 21%</span><span>' + eur(t.iva) + '</span></div><div style="align-items:baseline"><b>TOTAL</b><span class="g">' + eur(t.total) + '</span></div></div>';
}
function saveInvoice() {
  readInvHead();
  const dup = DB.all('invoices').find(x => String(x.num) === String(inv.num) && !sameId(x.id, inv.id));
  if (dup && !confirm('Ja existeix una factura amb el número ' + inv.num + '. Guardar igualment?')) return false;
  const t = invTotals(inv.lines);
  const rec = { id: inv.id || uid(), num: inv.num, date: inv.date, client: inv.client ? clone(inv.client) : null, clientId: inv.client ? String(inv.client.id || '') : '',
    lines: inv.lines.filter(l => (l.desc || '').trim() || num(l.price)).map(l => ({ desc: (l.desc || '').trim(), qty: num(l.qty), price: num(l.price) })),
    base: t.base, iva: t.iva, total: t.total, orderId: inv.orderId || null };
  const prev = inv.id ? DB.find('invoices', inv.id) : null;
  if (prev && prev.createdAt) rec.createdAt = prev.createdAt;
  DB.put('invoices', rec);
  inv.id = rec.id; inv.saved = true;
  renderAll();
  toast('✓ Factura ' + rec.num + ' guardada');
  return true;
}
function invYearOf(i) { return (isoFromAny(i.date) || '').slice(0, 4); }
function renderInvoices() {
  const all = DB.all('invoices');
  const years = Array.from(new Set(all.map(invYearOf).filter(Boolean))).sort().reverse();
  const ysel = $('#invYear');
  const curY = ysel.value;
  ysel.innerHTML = '<option value="">Tots els anys</option>' + years.map(y => '<option' + (y === curY ? ' selected' : '') + '>' + y + '</option>').join('');
  const list = all.filter(i => !ysel.value || invYearOf(i) === ysel.value)
    .sort((a, b) => (isoFromAny(b.date) || '').localeCompare(isoFromAny(a.date) || '') || String(b.num).localeCompare(String(a.num)));
  let tb = 0, ti = 0;
  list.forEach(i => { const t = invTotals(i.lines); tb += t.base; ti += t.iva; });
  $('#stTotal').textContent = eur(tb + ti); $('#stIva').textContent = eur(ti); $('#stNet').textContent = eur(tb);
  if (!list.length) { $('#invList').innerHTML = '<div class="card empty"><b>SOP.</b>Encara no hi ha factures</div>'; return; }
  $('#invList').innerHTML = '<div class="items">' + list.map(i => {
    const t = invTotals(i.lines);
    return '<div class="it">' +
      '<div class="it-h"><div><div class="it-t">FACTURA-' + esc(i.num) + '</div><div class="it-s">' + esc(i.client && i.client.name ? i.client.name : '—') + ' · ' + esc(fmtDate(i.date)) + '</div></div><div class="it-p">' + eur(t.total) + '</div></div>' +
      '<div class="it-lines">' + (i.lines || []).map(l => '<div><span>' + esc(l.desc) + ' × ' + esc(num(l.qty)) + '</span><span>' + eur(num(l.qty) * num(l.price)) + '</span></div>').join('') + '</div>' +
      '<div class="it-a">' +
        '<button class="bsm" data-act="inv-edit" data-id="' + esc(i.id) + '">Editar</button>' +
        '<button class="bsm" data-act="inv-print" data-id="' + esc(i.id) + '">Imprimir</button>' +
        '<button class="bsm" data-act="inv-alb" data-id="' + esc(i.id) + '">Albarà</button>' +
        '<span class="spacer"></span>' +
        '<button class="bsm danger" data-act="inv-del" data-id="' + esc(i.id) + '">Eliminar</button>' +
      '</div></div>';
  }).join('') + '</div>';
}

  setTimeout(fitPaper, 300);
}
function albFromOrder(o) {
  openAlbara({ ref: o.name || '', client: o.client || (o.clientId ? DB.find('clients', o.clientId) : null), rows: (o.items || []).map(i => ({ desc: i.name, qty: i.qty })) });
}
function albFromInvoice(i) {
  openAlbara({ ref: 'FACTURA-' + i.num, client: i.client || null, rows: (i.lines || []).filter(l => (l.desc || '').trim()).map(l => ({ desc: l.desc, qty: l.qty })) });
}

/* =====================================================================
   GOOGLE DRIVE (còpia de seguretat, connexió manual)
   ===================================================================== */
const Drive = { tc: null, token: null, exp: 0, fileId: null, state: 'off', last: null, timer: null, running: false, again: false };
const DRIVE_LABEL = { off: 'DRIVE', busy: 'SINCRONITZANT', ok: 'DRIVE', err: 'DRIVE', exp: 'RECONNECTA' };
function driveUI(state) {
  if (state) Drive.state = state;
  const b = $('#driveBtn');
  b.className = 'drive ' + Drive.state;
  $('span', b).textContent = DRIVE_LABEL[Drive.state];
  b.title = Drive.state === 'ok' && Drive.last ? 'Sincronitzat a les ' + Drive.last.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' }) : 'Google Drive';
}
function driveValid() { return !!Drive.token && Date.now() < Drive.exp; }
function driveClick() {
  if (Drive.token && Drive.state !== 'exp') { openDriveModal(); return; }
  driveConnect();
}
function driveConnect() {
  if (!(window.google && google.accounts && google.accounts.oauth2)) { toast('Carregant Google… torna-ho a provar en uns segons'); return; }
  if (!Drive.tc) {
    Drive.tc = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: driveOnToken,
      error_callback: () => { driveUI(Drive.token ? 'exp' : 'off'); toast('Connexió amb Drive cancel·lada'); }
    });
  }
  driveUI('busy');
  Drive.tc.requestAccessToken({ prompt: localStorage.getItem('sop_drive_ok') ? '' : 'consent' });
}
function driveOnToken(resp) {
  if (!resp || resp.error) { driveUI('off'); toast('No s\u2019ha pogut connectar amb Drive'); return; }
  Drive.token = resp.access_token;
  Drive.exp = Date.now() + ((Number(resp.expires_in) || 3600) - 60) * 1000;
  localStorage.setItem('sop_drive_ok', '1');
  driveSync(true);
}
function driveDisconnect() {
  try { if (Drive.token && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(Drive.token, () => {}); } catch (e) {}
  Drive.token = null; Drive.exp = 0; Drive.fileId = null; clearTimeout(Drive.timer);
  localStorage.removeItem('sop_drive_ok');
  driveUI('off'); closeModal(); toast('Drive desconnectat');
}
function driveSchedule() {
  if (!Drive.token) return;
  clearTimeout(Drive.timer);
  Drive.timer = setTimeout(() => driveSync(false), 2500);
}
async function gfetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + Drive.token }, opts.headers || {});
  const r = await fetch(url, opts);
  if (!r.ok) { const e = new Error('Drive HTTP ' + r.status); e.status = r.status; throw e; }
  return r;
}
async function drivePull() {
  const q = encodeURIComponent("name='" + DRIVE_FILE + "'");
  const r = await gfetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)&q=' + q);
  const j = await r.json();
  if (!j.files || !j.files.length) { Drive.fileId = null; return null; }
  Drive.fileId = j.files[0].id;
  const r2 = await gfetch('https://www.googleapis.com/drive/v3/files/' + Drive.fileId + '?alt=media');
  try { return await r2.json(); } catch (e) { return null; }
}
function payload() {
  const o = { app: 'sop-calculadora', version: 2, savedAt: new Date().toISOString(), deleted: lsGet('sop_deleted', {}), albNum: albCounter() };
  LISTS.forEach(n => { o[n] = DB.all(n); });
  return JSON.stringify(o);
}
async function drivePush() {
  const body = payload();
  if (Drive.fileId) {
    await gfetch('https://www.googleapis.com/upload/drive/v3/files/' + Drive.fileId + '?uploadType=media', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
  } else {
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify({ name: DRIVE_FILE, parents: ['appDataFolder'] })], { type: 'application/json' }));
    form.append('file', new Blob([body], { type: 'application/json' }));
    const r = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: form });
    Drive.fileId = (await r.json()).id;
  }
}
/* fusió per id: no es perd res; guanya la versió més recent; respecta esborrats */
function mergeRemote(remote) {
  if (!remote || typeof remote !== 'object') return false;
  const dead = Object.assign({}, remote.deleted || {}, lsGet('sop_deleted', {}));
  lsSet('sop_deleted', dead);
  if (remote.albNum && Number(remote.albNum) > albCounter()) setAlbCounter(Number(remote.albNum));
  let changed = false;
  LISTS.forEach(name => {
    const local = DB.all(name);
    const rem = migrate(name, remote[name]);
    const map = new Map();
    local.forEach(x => map.set(String(x.id), x));
    rem.forEach(x => {
      const k = String(x.id), l = map.get(k);
      if (!l || num(x.updatedAt) > num(l.updatedAt)) map.set(k, x);
    });
    const merged = Array.from(map.values()).filter(x => !dead[name + ':' + String(x.id)]);
    if (JSON.stringify(merged) !== JSON.stringify(local)) { DB.write(name, merged); changed = true; }
  });
  return changed;
}
async function driveSync(first) {
  if (!Drive.token) return;
  if (!driveValid()) { driveUI('exp'); return; }
  if (Drive.running) { Drive.again = true; return; }
  Drive.running = true; driveUI('busy');
  try {
    const remote = await drivePull();
    if (mergeRemote(remote)) renderAll();
    await drivePush();
    Drive.last = new Date();
    driveUI('ok');
    if (first) toast('✓ Drive connectat i sincronitzat');
  } catch (e) {
    console.error(e);
    if (e.status === 401 || e.status === 403) { driveUI('exp'); toast('La sessió de Drive ha caducat. Torna a connectar.'); }
    else { driveUI('err'); toast('Error de sincronització amb Drive'); }
  } finally {
    Drive.running = false;
    if (Drive.again) { Drive.again = false; driveSchedule(); }
  }
}
function openDriveModal() {
  const last = Drive.last ? Drive.last.toLocaleString('ca-ES') : 'mai';
  openModal('drive', 'Google Drive',
    '<p style="margin-top:0">Les dades es guarden al dispositiu i se\u2019n fa còpia automàtica a la carpeta privada de l\u2019app al teu Google Drive.</p>' +
    '<div class="box"><b>Estat:</b> ' + (Drive.state === 'ok' ? 'connectat' : Drive.state === 'err' ? 'error a l\u2019última sincronització' : Drive.state === 'busy' ? 'sincronitzant…' : 'sessió caducada') +
    '<br><b>Última sincronització:</b> ' + esc(last) + '</div>',
    '<button class="btn ghost" data-act="drive-off">Desconnectar</button><button class="btn red" data-act="drive-sync">Sincronitzar ara</button>');
}

/* =====================================================================
   ACCIONS (delegació d esdeveniments: tots els ids comparats com a string)
   ===================================================================== */
const ACTIONS = {
  'tab': id => goTab(id),
  'modal-close': () => closeModal(),

  /* calculadora */
  'calc-qty': d => { $('#calcQty').value = Math.max(1, calcQty() + num(d)); },
  'calc-add': () => {
    const it = makeItem(($('#calcName').value || '').trim(), calcQty(), calcV);
    addToOrder(it);
  },
  'calc-cat': () => saveToCatalog($('#calcName').value, calcV),

  /* comanda actual */
  'ord-qty': (id, el) => {
    const it = cur.items.find(x => sameId(x.id, id)); if (!it) return;
    it.qty = Math.max(1, num(it.qty) + num(el.dataset.d)); saveCur(); refreshItemRow(it); renderOrderTotals();
  },
  'ord-edit': id => { openItemId = sameId(openItemId, id) ? null : String(id); renderOrderItems(); },
  'ord-del': id => { cur.items = cur.items.filter(x => !sameId(x.id, id)); saveCur(); renderOrderItems(); },
  'ord-item-cat': id => { const it = cur.items.find(x => sameId(x.id, id)); if (it && it.v) saveToCatalog(it.name, it.v); else toast('Aquesta peça no té paràmetres de cost'); },
  'ord-add-cat': () => {
    const c = DB.find('catalog', $('#ordCatSel').value); if (!c) { toast('Tria un producte del catàleg'); return; }
    cur.items.push(catalogToItem(c)); saveCur(); $('#ordCatSel').value = ''; renderOrderItems(); toast('✓ ' + c.name + ' afegit');
  },
  'ord-save': () => saveOrder(),
  'ord-clear': () => {
    if (!cur.items.length && !cur.id && !cur.name) return;
    if (!confirm('Buidar la comanda actual? (Les comandes guardades no es toquen)')) return;
    cur = { id: null, name: '', clientId: '', items: [] }; openItemId = null; saveCur(); renderOrders();
  },

  /* historial */
  'hist-restore': id => {
    const o = DB.find('orders', id); if (!o) return;
    if (cur.items.length && !confirm('Tens una comanda en curs. Substituir-la per «' + o.name + '»?')) return;
    cur = { id: String(o.id), name: o.name || '', clientId: o.clientId || (o.client && o.client.id) || '', items: clone(o.items || []).map(i => { if (i.id == null) i.id = uid(); delete i.editing; return i; }) };
    openItemId = null; saveCur(); renderOrders(); window.scrollTo(0, 0); toast('Comanda recuperada');
  },
  'hist-inv': id => {
    const o = DB.find('orders', id); if (!o) return;
    const client = o.clientId ? (DB.find('clients', o.clientId) || o.client) : (o.client || null);
    startInvoice({ client, orderId: String(o.id), lines: (o.items || []).map(i => ({ desc: i.name, qty: num(i.qty), price: Math.round(num(i.unitPrice) * 100) / 100 })) });
  },
  'hist-alb': id => { const o = DB.find('orders', id); if (o) albFromOrder(o); },
  'hist-del': id => {
    if (!confirm('Eliminar aquesta comanda?')) return;
    DB.del('orders', id);
    if (sameId(cur.id, id)) { cur.id = null; saveCur(); }
    renderOrders(); toast('Comanda eliminada');
  },

  /* factures */
  'inv-new': () => startInvoice(),
  'inv-edit': id => editInvoice(id),
  'inv-print': id => { const i = DB.find('invoices', id); if (i) printDocument('FACTURA-' + i.num, invoiceDocHTML(i)); },
  'inv-alb': id => { const i = DB.find('invoices', id); if (i) albFromInvoice(i); },
  'inv-del': id => { if (!confirm('Eliminar aquesta factura?')) return; DB.del('invoices', id); renderInvoices(); toast('Factura eliminada'); },
  'invw-pick': id => { const c = DB.find('clients', id); if (!c) return; inv.client = clone(c); inv.clientId = String(c.id); invStep(2); },
  'invw-quick': () => {
    const c = readClientFields('qc_');
    if (!c.name) { toast('Falta el nom del client'); return; }
    const saved = DB.put('clients', c);
    inv.client = clone(saved); inv.clientId = String(saved.id); toast('✓ Client creat'); invStep(2);
  },
  'invw-step': id => {
    const n = num(id);
    if (inv.step === 2) readInvHead();
    if (n >= 2 && !inv.client) { toast('Selecciona un client'); return; }
    invStep(n);
  },
  'invw-line-add': () => { inv.lines.push({ desc: '', qty: 1, price: 0 }); renderInvLines(); const last = $$('#invLines [data-lf="desc"]').pop(); if (last) last.focus(); },
  'invw-line-del': id => { if (inv.lines.length <= 1) return; inv.lines.splice(num(id), 1); renderInvLines(); },
  'invw-cat-add': () => {
    const c = DB.find('catalog', $('#invCatSel').value); if (!c) { toast('Tria un producte del catàleg'); return; }
    const line = { desc: c.name + (c.ref ? ' (' + c.ref + ')' : ''), qty: 1, price: Math.round(catalogPrice(c) * 100) / 100 };
    const empty = inv.lines.findIndex(l => !(l.desc || '').trim() && !num(l.price));
    if (empty >= 0) inv.lines[empty] = line; else inv.lines.push(line);
    $('#invCatSel').value = ''; renderInvLines(); toast('✓ ' + c.name + ' afegit');
  },
  'invw-save': () => { if (saveInvoice()) invStep(3); },
  'invw-print': () => { printDocument('FACTURA-' + inv.num, invoiceDocHTML(inv)); if (!inv.saved) toast('Recorda guardar la factura'); },
  'invw-alb': () => albFromInvoice(inv),

  /* albarà */
  'alb-print': () => {
    readAlbara();
    if (printDocument('ALB-' + alb.num, albaraDocHTML(alb))) {
      const n = parseInt(alb.num, 10);
      if (n > albCounter()) { setAlbCounter(n); driveSchedule(); }
    }
  },

  /* catàleg */
  'cat-new': () => openCatalogForm(null),
  'cat-edit': id => openCatalogForm(id),
  'catf-save': () => saveCatalogForm(),
  'cat-del': id => { if (!confirm('Eliminar aquest producte del catàleg?')) return; DB.del('catalog', id); renderCatalog(); toast('Producte eliminat'); },
  'cat-order': id => { const c = DB.find('catalog', id); if (!c) return; addToOrder(catalogToItem(c)); },
  'cat-calc': id => { const c = DB.find('catalog', id); if (!c) return; loadIntoCalc(c.name, c.v); goTab('calc'); toast('Carregat a la calculadora'); },

  /* clients */
  'cli-new': () => openClientForm(null),
  'cli-edit': id => openClientForm(id),
  'clif-save': () => saveClientForm(),
  'cli-del': id => { if (!confirm('Eliminar aquest client? (Les factures ja emeses conserven les seves dades)')) return; DB.del('clients', id); renderClients(); toast('Client eliminat'); },

  /* drive */
  'drive': () => driveClick(),
  'drive-sync': () => { closeModal(); driveSync(false); },
  'drive-off': () => driveDisconnect()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { fn(el.dataset.id, el, e); }
  catch (err) { console.error(err); toast('Error inesperat: ' + err.message); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.iname !== undefined) {
    const it = cur.items.find(x => sameId(x.id, t.dataset.iname)); if (it) { it.name = t.value; saveCur(); }
  } else if (t.id === 'ordName') { cur.name = t.value; saveCur(); }
  else if (t.dataset.li !== undefined && inv) {
    const l = inv.lines[num(t.dataset.li)]; if (!l) return;
    l[t.dataset.lf] = t.dataset.lf === 'desc' ? t.value : num(t.value);
    const imp = $('[data-limp="' + t.dataset.li + '"]'); if (imp) imp.textContent = eur(num(l.qty) * num(l.price));
    renderInvTot();
  }
  else if (t.id === 'invCliSearch') renderInvClientList();
  else if (t.id === 'cliSearch') renderClients();
  else if (t.id === 'catSearch') renderCatalog();
  else if (modalKind === 'alb' && ['albDate', 'albNum', 'albRef', 'albNotes'].indexOf(t.id) >= 0) renderAlbara();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ordClient') { cur.clientId = t.value; saveCur(); }
  else if (t.id === 'invYear') renderInvoices();
  else if (t.id === 'albClient') renderAlbara();
  else if (t.id === 'calcQty') t.value = calcQty();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalKind) closeModal(); });
window.addEventListener('resize', fitPaper);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Drive.token && !driveValid()) driveUI('exp');
});

/* =====================================================================
   INIT
   ===================================================================== */
(function init() {
  $('#logoTop').src = LOGO;
  const docStyle = document.createElement('style');
  docStyle.textContent = DOC_CSS; // mateix CSS per a la vista prèvia que per a la finestra d impressió
  document.head.appendChild(docStyle);
  migrateLocal();
  initCalc();
  driveUI('off');
  let t = 'calc';
  try { t = localStorage.getItem('sop_tab') || 'calc'; } catch (e) {}
  goTab(['calc', 'orders', 'invoices', 'catalog', 'clients'].indexOf(t) >= 0 ? t : 'calc');
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
